<style>
/* Layout: cây ngang trái → phải (vòng đời đơn hàng), nhánh thu gọn được, cuộn ngang trong khung riêng */
:root {

  --hit: #ffe27a;
  --font-body: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {

    --bg: #10141a; --surface: #19202a; --fg: #e5e9ef; --muted: #9ba6b5; --line: #3b4553; --focus: #7aa7ff;
    --on-br: #0f131a;
    --b1: #7ea2ff; --b2: #fb8f55; --b3: #3fcf97; --b4: #b197fc; --b5: #3cc4de;
    --b6: #f47b70; --b7: #e5b748; --b8: #f47bb4; --b9: #a3d65a; --b10: #a5b2c4;
    --hit: #6b5a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141a; --surface: #19202a; --fg: #e5e9ef; --muted: #9ba6b5; --line: #3b4553; --focus: #7aa7ff;
  --on-br: #0f131a;
  --b1: #7ea2ff; --b2: #fb8f55; --b3: #3fcf97; --b4: #b197fc; --b5: #3cc4de;
  --b6: #f47b70; --b7: #e5b748; --b8: #f47bb4; --b9: #a3d65a; --b10: #a5b2c4;
  --hit: #6b5a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: 20px 32px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 6px; max-width: 900px; }
h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); max-width: 70ch; }
.src { font-family: var(--font-mono); font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.search { flex: 1 1 260px; max-width: 420px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; padding-block: 8px; outline: none; }
.search:focus-within { border-color: var(--focus); }
.count-hit { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.btn { font: inherit; font-size: 13px; font-weight: 500; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.canvas { overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px 20px; }
.tree, .children { list-style: none; margin: 0; padding: 0; }
.tree { width: max-content; }
.item { display: flex; align-items: center; position: relative; }
.children { display: flex; flex-direction: column; padding-left: 44px; position: relative; }
.children::before { content: ''; position: absolute; left: 0; top: 50%; width: 22px; border-top: 1.5px solid var(--line); }
.children > .item { padding-block: 4px; }
.children > .item::before { content: ''; position: absolute; left: -22px; top: 0; bottom: 0; border-left: 1.5px solid var(--line); }
.children > .item:first-child::before { top: 50%; }
.children > .item:last-child::before { bottom: 50%; }
.children > .item:only-child::before { display: none; }
.children > .item::after { content: ''; position: absolute; left: -22px; top: 50%; width: 22px; border-top: 1.5px solid var(--line); }
.item.collapsed > .children { display: none; }

.card {
  font: inherit; color: var(--fg); text-align: left; display: flex; flex-direction: column; gap: 4px;
  min-width: 120px; max-width: 330px; padding: 8px 11px; border-radius: 8px;
  background: color-mix(in srgb, var(--br, var(--b10)) 7%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--br, var(--b10)) 38%, var(--line));
}
button.card { cursor: pointer; }
button.card:hover { border-color: var(--br, var(--muted)); }
.card .t { font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
.card .t .lbl { flex: 1; min-width: 0; }
.card .n { color: var(--muted); font-size: 12.5px; }
.card ol { margin: 2px 0 0; padding-left: 20px; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; }
.card a { font-family: var(--font-mono); font-size: 11.5px; color: var(--br, var(--focus)); word-break: break-all; }
.tag { font-family: var(--font-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.02em; padding: 1px 5px; border-radius: 4px; border: 1px solid color-mix(in srgb, var(--br, var(--b10)) 45%, transparent); color: var(--br, var(--muted)); white-space: nowrap; }
.more { font-size: 11px; font-weight: 600; color: var(--br, var(--muted)); white-space: nowrap; font-variant-numeric: tabular-nums; }
.item:not(.collapsed) > .card .more { display: none; }

.d0 > .card { background: var(--fg); color: var(--bg); border-color: var(--fg); font-size: 17px; padding: 12px 18px; border-radius: 12px; min-width: 0; }
.d0 > .card .n { color: color-mix(in srgb, var(--bg) 75%, var(--fg)); }
.d1 > .card { background: var(--br); border-color: var(--br); color: var(--on-br); font-size: 14.5px; }
.d1 > .card .n, .d1 > .card .more { color: color-mix(in srgb, var(--on-br) 82%, var(--br)); }
.d1 > .card .tag { color: var(--on-br); border-color: color-mix(in srgb, var(--on-br) 50%, transparent); }
.card.hit { box-shadow: 0 0 0 3px var(--hit); }

@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s, box-shadow .15s; }
}
</style>

</div>

const DEFAULT_DEPTH = 1;
const tree = document.getElementById('tree');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'd').toLowerCase();

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function build(node, depth, branch) {
  const li = el('li', 'item d' + Math.min(depth, 2));
  if (depth === 1) li.style.setProperty('--br', 'var(--b' + branch + ')');
  const has = node.c && node.c.length;
  const card = el(has ? 'button' : 'div', 'card');
  if (has) card.type = 'button';
  const t = el('div', 't');
  t.append(el('span', 'lbl', node.t));
  if (node.tag) t.append(el('span', 'tag', node.tag));
  if (has) t.append(el('span', 'more', '+' + node.c.length));
  card.append(t);
  if (node.n) card.append(el('div', 'n', node.n));
  if (node.steps) {
    const ol = el('ol');
    node.steps.forEach(s => ol.append(el('li', null, s)));
    card.append(ol);
  }
  if (node.url) {
    const a = el('a', null, node.url);
    a.href = node.url; a.target = '_blank'; a.rel = 'noopener';
    a.addEventListener('click', e => e.stopPropagation());
    card.append(a);
  }
  card.dataset.text = norm([node.t, node.tag, node.n, (node.steps || []).join(' '), node.url].filter(Boolean).join(' '));
  li.append(card);
  if (has) {
    li.dataset.depth = depth;
    const ul = el('ul', 'children');
    node.c.forEach((ch, i) => ul.append(build(ch, depth + 1, depth === 0 ? (i % 10) + 1 : branch)));
    li.append(ul);
    card.addEventListener('click', () => setCollapsed(li, !li.classList.contains('collapsed')));
  }
  return li;
}

function setCollapsed(li, v) {
  li.classList.toggle('collapsed', v);
  const card = li.querySelector(':scope > .card');
  if (card.tagName === 'BUTTON') card.setAttribute('aria-expanded', String(!v));
}
function applyDepth(max) {
  tree.querySelectorAll('li[data-depth]').forEach(li => setCollapsed(li, +li.dataset.depth >= max));
}

tree.append(build(DATA, 0, 0));
applyDepth(DEFAULT_DEPTH);

document.getElementById('expand').onclick = () => applyDepth(99);
document.getElementById('collapse').onclick = () => applyDepth(0);
document.getElementById('reset').onclick = () => { q.value = ''; search(); applyDepth(DEFAULT_DEPTH); };

const q = document.getElementById('q');
const hits = document.getElementById('hits');
function search() {
  const term = norm(q.value.trim());
  tree.querySelectorAll('.card.hit').forEach(c => c.classList.remove('hit'));
  if (!term) { hits.textContent = ''; return; }
  applyDepth(0);
  const found = [...tree.querySelectorAll('.card')].filter(c => c.dataset.text.includes(term));
  found.forEach(c => {
    c.classList.add('hit');
    let p = c.parentElement.parentElement.closest('li');
    while (p) { setCollapsed(p, false); p = p.parentElement.closest('li'); }
  });
  hits.textContent = found.length ? found.length + ' kết quả' : 'Không có kết quả';
  if (found[0]) found[0].scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
}
q.addEventListener('input', search);
